<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>Money Map｜我的資金地圖</title>
<style>
:root{
  --navy:#17324d; --navy2:#254d70; --cream:#f7f4ee; --card:#fff;
  --text:#1f2a35; --muted:#78838d; --line:#e4e7ea; --soft:#eef3f7;
  --green:#2d7865; --red:#b85c5c; --gold:#b58a3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:100px}
header{background:var(--navy);color:white;padding:28px 20px 24px;border-radius:0 0 28px 28px}
.eyebrow{font-size:13px;opacity:.72;letter-spacing:.12em}
h1{margin:6px 0 18px;font-size:27px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .box{background:rgba(255,255,255,.1);padding:13px;border-radius:16px}
.summary small{display:block;opacity:.72;margin-bottom:5px}
.summary strong{font-size:20px}
main{padding:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}
.section-title h2{font-size:18px;margin:0}
button{font:inherit}
.linkbtn{border:0;background:none;color:var(--navy2);font-weight:700;padding:5px}
.bucket{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px;box-shadow:0 5px 18px rgba(25,45,65,.04)}
.bucket-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bucket-name{font-weight:800;font-size:17px}
.bucket-account{font-size:12px;color:var(--muted);margin-top:3px}
.bucket-amount{font-size:21px;font-weight:800;text-align:right}
.goal{margin-top:13px}
.goal-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:8px;background:#edf0f2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy2);border-radius:99px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;border:0;border-radius:12px;padding:10px;background:var(--soft);color:var(--navy);font-weight:750}
.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:24px;border:0;border-radius:18px;background:var(--navy);color:#fff;padding:15px 20px;font-weight:800;box-shadow:0 8px 25px rgba(23,50,77,.25)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:10;padding:20px;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:white;width:min(100%,680px);border-radius:24px;padding:20px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 16px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,select{width:100%;border:1px solid #d9dfe4;border-radius:13px;padding:12px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;border:0;background:var(--navy);color:#fff;border-radius:14px;padding:13px;font-weight:800;margin-top:16px}
.secondary{width:100%;border:0;background:#eef1f3;color:var(--text);border-radius:14px;padding:12px;font-weight:700;margin-top:8px}
.danger{color:var(--red)}
.history{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.tx{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #f0f1f2;font-size:14px}
.tx small{color:var(--muted)}
.plus{color:var(--green);font-weight:800}.minus{color:var(--red);font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:4px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px 20px 30px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="eyebrow">MONEY MAP</div>
  <h1>我的資金地圖</h1>
  <div class="summary">
    <div class="box"><small>資金桶合計</small><strong id="total">NT$ 0</strong></div>
    <div class="box"><small>距 VT 100萬</small><strong id="vtRemain">尚未設定</strong></div>
  </div>
</header>

<main>
  <div class="section-title"><h2>我的資金桶</h2><button class="linkbtn" onclick="openBucket()">＋ 新增</button></div>
  <div id="bucketList"></div>
</main>
<footer>不記每杯咖啡，只看錢現在在哪裡、準備做什麼。</footer>
</div>

<button class="fab" onclick="openTx()">＋ 資金異動</button>

<div class="modal" id="txModal">
 <div class="sheet">
  <h3>資金異動</h3>
  <div class="row">
   <div><label>日期</label><input type="date" id="txDate"></div>
   <div><label>動作</label><select id="txType"><option value="in">投入 ＋</option><option value="out">取用 −</option></select></div>
  </div>
  <label>資金桶</label><select id="txBucket"></select>
  <label>金額</label><input type="number" id="txAmount" inputmode="numeric" placeholder="例如 10000">
  <label>備註（可不填）</label><input id="txNote" placeholder="例如：10月旅遊基金">
  <button class="primary" onclick="saveTx()">儲存</button>
  <button class="secondary" onclick="closeModal('txModal')">取消</button>
 </div>
</div>

<div class="modal" id="bucketModal">
 <div class="sheet">
  <h3 id="bucketTitle">新增資金桶</h3>
  <input type="hidden" id="bucketId">
  <label>名稱</label><input id="bucketName" placeholder="例如：旅遊基金">
  <label>放在哪裡（可不填）</label><input id="bucketAccount" placeholder="例如：郵局、中信、券商">
  <div class="row">
   <div><label>目前金額</label><input type="number" id="bucketBalance" inputmode="numeric" placeholder="55000"></div>
   <div><label>目標金額（可不填）</label><input type="number" id="bucketGoal" inputmode="numeric" placeholder="100000"></div>
  </div>
  <button class="primary" onclick="saveBucket()">儲存</button>
  <button class="secondary danger" id="deleteBtn" style="display:none" onclick="deleteBucket()">刪除這個資金桶</button>
  <button class="secondary" onclick="closeModal('bucketModal')">取消</button>
 </div>
</div>

<div class="modal" id="detailModal">
 <div class="sheet">
  <h3 id="detailTitle"></h3>
  <div id="detailInfo"></div>
  <div class="history"><strong>異動紀錄</strong><div id="historyList"></div></div>
  <button class="secondary" onclick="closeModal('detailModal')">關閉</button>
 </div>
</div>

<script>
const KEY='moneyMap_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null') || {
 buckets:[
  {id:'deposit',name:'郵局定存',account:'郵局',balance:500000,goal:null},
  {id:'cash',name:'中信現金',account:'中信',balance:400000,goal:null},
  {id:'travel',name:'旅遊基金',account:'郵局',balance:55000,goal:null},
  {id:'pocket',name:'零花錢',account:'',balance:122000,goal:null},
  {id:'bra',name:'運動內衣基金',account:'',balance:0,goal:null},
  {id:'vt',name:'VT',account:'美股',balance:0,goal:1000000}
 ], tx:[]
};
function money(n){return 'NT$ '+Math.round(n||0).toLocaleString('zh-TW')}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){
 const list=document.getElementById('bucketList');
 list.innerHTML='';
 let total=0;
 data.buckets.forEach(b=>{
  total+=Number(b.balance)||0;
  let pct=b.goal?Math.min(100,(b.balance/b.goal)*100):0;
  const el=document.createElement('div'); el.className='bucket';
  el.innerHTML=`<div class="bucket-top">
    <div><div class="bucket-name">${esc(b.name)}</div><div class="bucket-account">${b.account?esc(b.account):'未指定帳戶'}</div></div>
    <div class="bucket-amount">${money(b.balance)}</div>
   </div>
   ${b.goal?`<div class="goal"><div class="goal-line"><span>目標 ${money(b.goal)}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`:''}
   <div class="actions"><button onclick="openTx('${b.id}')">＋/− 異動</button><button onclick="showDetail('${b.id}')">紀錄</button><button onclick="openBucket('${b.id}')">設定</button></div>`;
  list.appendChild(el);
 });
 if(!data.buckets.length) list.innerHTML='<div class="empty">還沒有資金桶，先新增一個吧。</div>';
 document.getElementById('total').textContent=money(total);
 const vt=data.buckets.find(b=>b.id==='vt'||b.name.toUpperCase()==='VT');
 document.getElementById('vtRemain').textContent=vt&&vt.goal?money(Math.max(0,vt.goal-vt.balance)):'尚未設定';
 refreshSelect();
}
function refreshSelect(){
 const s=document.getElementById('txBucket');
 s.innerHTML=data.buckets.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
}
function openTx(id){
 document.getElementById('txDate').value=new Date().toISOString().slice(0,10);
 document.getElementById('txAmount').value='';
 document.getElementById('txNote').value='';
 if(id) document.getElementById('txBucket').value=id;
 document.getElementById('txModal').classList.add('show');
}
function saveTx(){
 const id=document.getElementById('txBucket').value;
 const b=data.buckets.find(x=>x.id===id);
 const amount=Number(document.getElementById('txAmount').value);
 const type=document.getElementById('txType').value;
 if(!b||!amount||amount<=0)return alert('請輸入金額');
 if(type==='out' && amount>b.balance && !confirm('取用金額大於目前餘額，仍要繼續嗎？'))return;
 b.balance += type==='in'?amount:-amount;
 data.tx.unshift({id:Date.now().toString(),bucketId:id,date:document.getElementById('txDate').value,type,amount,note:document.getElementById('txNote').value.trim()});
 closeModal('txModal');save();
}
function openBucket(id){
 const b=data.buckets.find(x=>x.id===id);
 document.getElementById('bucketId').value=b?b.id:'';
 document.getElementById('bucketTitle').textContent=b?'編輯資金桶':'新增資金桶';
 document.getElementById('bucketName').value=b?b.name:'';
 document.getElementById('bucketAccount').value=b?b.account:'';
 document.getElementById('bucketBalance').value=b?b.balance:'';
 document.getElementById('bucketGoal').value=b&&b.goal?b.goal:'';
 document.getElementById('deleteBtn').style.display=b?'block':'none';
 document.getElementById('bucketModal').classList.add('show');
}
function saveBucket(){
 const id=document.getElementById('bucketId').value;
 const name=document.getElementById('bucketName').value.trim();
 if(!name)return alert('請輸入名稱');
 const obj={name,account:document.getElementById('bucketAccount').value.trim(),balance:Number(document.getElementById('bucketBalance').value)||0,goal:Number(document.getElementById('bucketGoal').value)||null};
 if(id){const b=data.buckets.find(x=>x.id===id);Object.assign(b,obj)}
 else data.buckets.push({id:'b'+Date.now(),...obj});
 closeModal('bucketModal');save();
}
function deleteBucket(){
 const id=document.getElementById('bucketId').value;
 if(!confirm('確定刪除？相關異動紀錄也會一起刪除。'))return;
 data.buckets=data.buckets.filter(b=>b.id!==id);
 data.tx=data.tx.filter(t=>t.bucketId!==id);
 closeModal('bucketModal');save();
}
function showDetail(id){
 const b=data.buckets.find(x=>x.id===id); if(!b)return;
 document.getElementById('detailTitle').textContent=b.name;
 document.getElementById('detailInfo').innerHTML=`<div class="bucket-amount" style="text-align:left">${money(b.balance)}</div><div class="note">${b.account?'存放：'+esc(b.account):''}</div>`;
 const txs=data.tx.filter(t=>t.bucketId===id);
 document.getElementById('historyList').innerHTML=txs.length?txs.map(t=>`<div class="tx"><small>${t.date}</small><div>${t.note?esc(t.note):(t.type==='in'?'投入':'取用')}</div><div class="${t.type==='in'?'plus':'minus'}">${t.type==='in'?'+':'−'}${money(t.amount).replace('NT$ ','')}</div></div>`).join(''):'<div class="empty">還沒有異動紀錄</div>';
 document.getElementById('detailModal').classList.add('show');
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));
render();
</script>
</body>
</html>
